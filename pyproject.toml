[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxitrack"
version = "1.0.0"
description = "End-to-end NYC Taxi data platform with Airflow, ClickHouse, dbt, LightGBM, ONNX, and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ziad Ashraf", email = "ziadashraf98765@gmail.com" }
]

dependencies = [
    "clickhouse-connect>=0.7.0",
    "minio>=7.2.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Data Ingestion & Orchestration (Pure Data Engineering - Lean & Fast)
data = [
    "apache-airflow>=2.10.0,<3.0.0",
    "psycopg2-binary>=2.9.9",
    "fastparquet>=2024.2.0",
    "tqdm>=4.66.0",
    "dbt-core>=1.8.0,<1.9.0",
    "dbt-clickhouse>=1.8.0,<1.9.0",
]

# Machine Learning & Model Development
ml = [
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0,<2.0.0",
    "xgboost>=2.0.0",
    "mlflow>=2.20.0,<2.21.0",  # Strictly matches server image ghcr.io/mlflow/mlflow:v2.20.0
    "networkx>=3.2.0",
    "onnx>=1.15.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.16.0",
    "onnxruntime>=1.17.0",
]

# High-performance FastAPI Model Serving
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "onnxruntime>=1.17.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

# Streamlit Interactive Dashboard UI
ui = [
    "streamlit>=1.32.0",
    "altair>=5.2.0",
]

# Data & ML Observability
monitoring = [
    "evidently>=0.4.15",
    "great-expectations>=0.18.0",
    "prometheus-client>=0.20.0",
]

# Development, Testing & Code Quality
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "black>=24.2.0",
]

# All dependencies for a full local environment
all = [
    "taxitrack[data,ml,api,ui,monitoring,dev]"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "dbt",
    "postgres_airflow",
    "minio_storage",
    "logs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.hatch.build.targets.wheel]
bypass-selection = true

