# ==============================================================================
# TAXITRACK MACHINE LEARNING CONFIGURATION (SINGLE SOURCE OF TRUTH - SSOT)
# Controls Data extraction, Feature Engineering, Forecaster Model, Evidently Drift,
# and MLflow Model Registry Tracking.
# ==============================================================================

pipeline:
  name: "taxitrack_demand_forecasting_pipeline"
  version: "2.0.0"
  environment: "production"

data:
  mart_table: "data_warehouse.mart_demand_prediction"
  timestamp_col: "pickup_datetime"
  target_col: "total_trips"
  group_cols:
    - "pickup_zone"
    - "pickup_borough"
    - "service_type"
  group_col: "group_id"
  # Training window configuration
  start_date: "2019-01-01"
  end_date: "2020-07-01"
  test_months: 2
  frequency: "1h"

features:
  lag_hours:
    - 24    # Daily seasonality (same hour yesterday)
    - 168   # Weekly seasonality (same hour last week)
  rolling_windows:
    - 6     # Intra-day trend (past 6 hours)
    - 24    # Daily trend (past 24 hours)
  use_cyclical_encodings: true  # sin/cos for hour and day-of-week
  categorical_features:
    - "time_of_day"
    - "group_id"

model:
  # Model strategy: "LightGBM" or "XGBoost"
  model_type: "LightGBM"
  hyperparameters:
    n_estimators: 1500
    learning_rate: 0.05
    num_leaves: 128
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    objective: "regression"
    metric: "mae"
    importance_type: "gain"
    verbose: -1
  early_stopping_rounds: 50

monitoring:
  # Evidently AI Multi-Type Drift Configuration
  evidently:
    enabled: true
    reference_window_days: 60      # Historic reference baseline window
    current_window_days: 14        # Evaluation window for drift detection
    drift_share_threshold: 0.3    # Alert if > 30% of features drift
    target_drift_threshold: 0.05  # p-value threshold for target distribution shift
    confidence_level: 0.95
    # Supported drift tests per feature category
    tests:
      numeric: "wasserstein"       # Wasserstein distance for continuous features
      categorical: "jensen_shannon" # Jensen-Shannon divergence for categories
      target: "ks"                 # Kolmogorov-Smirnov test for trip demand

serving:
  export_onnx: true
  onnx_output_path: "./models/lightgbm_model.onnx"
  target_opset: 15
  parity_tolerance: 0.0001
  benchmark_runs: 500

mlflow:
  experiment_name: "taxitrack_demand_forecasting"
  registered_model_name: "taxi-demand-forecaster"
  tracking_uri: "http://localhost:5000"
  artifact_bucket: "mlflow-artifacts"
