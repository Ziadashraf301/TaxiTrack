services:
  # ============================================================================
  # CORE STORAGE & OLAP WAREHOUSE (Always Available)
  # ============================================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_storage:/data
    networks:
      - taxitrack-net

  # Automated bucket provisioning using cached minio/mc image
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password123}; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/taxi-green;
        /usr/bin/mc mb --ignore-existing local/taxi-yellow;
        /usr/bin/mc mb --ignore-existing local/mlflow-artifacts;
        echo 'MinIO buckets verified.';
      "
    networks:
      - taxitrack-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    hostname: clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9005}:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-data_warehouse}
    volumes:
      - clickhouse_data_warehouse:/var/lib/clickhouse
    networks:
      - taxitrack-net

  # ============================================================================
  # UNIFIED POSTGRESQL (Core Tier - Serves Airflow, MLflow, and Metabase on Port 5432)
  # Uses your existing ./postgres_airflow data with zero re-download/re-ingest!
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres_airflow:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    command: >
      bash -c "
        /usr/local/bin/docker-entrypoint.sh postgres &
        pid=\$$!
        until pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-airflow}; do sleep 1; done
        /docker-entrypoint-initdb.d/init-multiple-dbs.sh || true
        wait \$$pid
      "
    networks:
      - taxitrack-net

  # ============================================================================
  # DATA PROFILE (Airflow Orchestration, Native dbt Transformations, Metabase BI)
  # Run with: docker compose --profile data up -d
  # ============================================================================
  airflow-init:
    profiles: ["data"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow_init
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-t_8Y9aZ4pQeQv7mX1uJ5wK3rT8yB6eN0pL9sR4vY7xM=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      TZ: ${TZ:-Africa/Cairo}
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_DEFAULT_TIMEZONE:-Africa/Cairo}
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: ${AIRFLOW_DEFAULT_TIMEZONE:-Africa/Cairo}
      PYTHONPATH: /opt/airflow/src:/usr/local/lib/python3.12/site-packages
      DBT_PROFILES_DIR: /opt/dbt
      DBT_PROJECT_DIR: /opt/dbt
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-data_warehouse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_TCP_PORT: ${CLICKHOUSE_TCP_PORT:-9005}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_HOST: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
    volumes:
      - ./.env:/opt/airflow/.env:ro
      - ./src:/opt/airflow/src:ro
      - ./configs:/opt/airflow/configs:ro
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt:/opt/dbt
    entrypoint: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@taxitrack.local || true &&
        airflow dags unpause ml_model_retrain_and_evaluate_dag || true &&
        airflow dags unpause ml_drift_monitoring_dag || true &&
        airflow dags unpause ingest_transform_agg_network_dag || true
      "
    networks:
      - taxitrack-net

  airflow-webserver:
    profiles: ["data"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      - postgres
      - airflow-init
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-t_8Y9aZ4pQeQv7mX1uJ5wK3rT8yB6eN0pL9sR4vY7xM=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__SESSION_BACKEND: securecookie
      TZ: ${TZ:-Africa/Cairo}
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_DEFAULT_TIMEZONE:-Africa/Cairo}
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: ${AIRFLOW_DEFAULT_TIMEZONE:-Africa/Cairo}
      PYTHONPATH: /opt/airflow/src:/usr/local/lib/python3.12/site-packages
      DBT_PROFILES_DIR: /opt/dbt
      DBT_PROJECT_DIR: /opt/dbt
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-data_warehouse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_TCP_PORT: ${CLICKHOUSE_TCP_PORT:-9005}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_HOST: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
    command: webserver
    volumes:
      - ./.env:/opt/airflow/.env:ro
      - ./src:/opt/airflow/src:ro
      - ./configs:/opt/airflow/configs:ro
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt:/opt/dbt
      - ./airflow/airflow_logs:/opt/airflow/logs
      - ./reports:/opt/airflow/reports
      - ./models:/opt/airflow/models
    networks:
      - taxitrack-net

  airflow-scheduler:
    profiles: ["data"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      - airflow-webserver
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-t_8Y9aZ4pQeQv7mX1uJ5wK3rT8yB6eN0pL9sR4vY7xM=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      TZ: ${TZ:-Africa/Cairo}
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_DEFAULT_TIMEZONE:-Africa/Cairo}
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: ${AIRFLOW_DEFAULT_TIMEZONE:-Africa/Cairo}
      PYTHONPATH: /opt/airflow/src:/usr/local/lib/python3.12/site-packages
      DBT_PROFILES_DIR: /opt/dbt
      DBT_PROJECT_DIR: /opt/dbt
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-data_warehouse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_TCP_PORT: ${CLICKHOUSE_TCP_PORT:-9005}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_HOST: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
    command: scheduler
    volumes:
      - ./.env:/opt/airflow/.env:ro
      - ./src:/opt/airflow/src:ro
      - ./configs:/opt/airflow/configs:ro
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt:/opt/dbt
      - ./airflow/airflow_logs:/opt/airflow/logs
      - ./reports:/opt/airflow/reports
      - ./models:/opt/airflow/models
    networks:
      - taxitrack-net

  # ============================================================================
  # ML PROFILE (MLflow Tracking, FastAPI Serving, Streamlit Dashboard)
  # Run with: docker compose --profile ml up -d
  # ============================================================================
  mlflow:
    profiles: ["data", "ml", "serving"]
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow_server
    hostname: mlflow
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
    command: >
      mlflow server
        --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow123}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
        --default-artifact-root s3://mlflow-artifacts/
        --host 0.0.0.0
        --port 5000
    networks:
      - taxitrack-net

  model-api:
    profiles: ["ml", "serving"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: model_api
    restart: unless-stopped
    depends_on:
      - clickhouse
      - mlflow
      - minio
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-data_warehouse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_TCP_PORT: ${CLICKHOUSE_TCP_PORT:-9005}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_HOST: minio
      PYTHONPATH: /app/src
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
    networks:
      - taxitrack-net

  streamlit:
    profiles: ["ml", "serving"]
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: streamlit_app
    restart: unless-stopped
    depends_on:
      - model-api
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://model-api:8000
      PYTHONPATH: /app/src
      STREAMLIT_THEME_BASE: "light"
      STREAMLIT_THEME_PRIMARY_COLOR: "#2563EB"
      STREAMLIT_THEME_BACKGROUND_COLOR: "#F8F9FD"
      STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR: "#FFFFFF"
      STREAMLIT_THEME_TEXT_COLOR: "#0F172A"
    command: streamlit run src/ui/app.py --server.port=8501 --server.address=0.0.0.0 --server.runOnSave=true --theme.base=light --theme.primaryColor=#2563EB --theme.backgroundColor=#F8F9FD --theme.secondaryBackgroundColor=#FFFFFF --theme.textColor=#0F172A
    volumes:
      - ./src:/app/src
      - ./.streamlit:/app/.streamlit:ro
      - ./configs:/app/configs:ro
    networks:
      - taxitrack-net

  # ============================================================================
  # MONITORING PROFILE (Prometheus Metrics & Grafana Dashboards)
  # Run with: docker compose --profile monitoring up -d
  # ============================================================================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - taxitrack-net

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - taxitrack-net

# ==============================================================================
# DOCKER MANAGED NAMED VOLUMES (Isolated from Host & Safe from OneDrive Sync)
# ==============================================================================
volumes:
  minio_data:
    name: taxitrack_minio_data
  clickhouse_data_warehouse:
    name: taxitrack_clickhouse_data
  postgres_data:
    name: taxitrack_postgres_data
  prometheus_data:
    name: taxitrack_prometheus_data
  grafana_data:
    name: taxitrack_grafana_data

# ==============================================================================
# DEDICATED BRIDGE NETWORK
# ==============================================================================
networks:
  taxitrack-net:
    name: taxitrack-net
    driver: bridge
