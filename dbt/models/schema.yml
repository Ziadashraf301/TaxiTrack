version: 2

sources:
  - name: staging
    schema: data_warehouse
    tables:
      - name: green_trips_batch
        description: "Raw ingested Green Taxi parquet batches from MinIO."
      - name: yellow_trips_batch
        description: "Raw ingested Yellow Taxi parquet batches from MinIO."

models:
  - name: stg_green_trips
    description: "Standardized Green Taxi trip records with deterministic MD5 surrogate key."
    columns:
      - name: trip_id
        description: "Deterministic MD5 surrogate primary key."
        tests:
          - unique:
              config:
                severity: warn
          - not_null
      - name: pickup_datetime
        tests:
          - not_null

  - name: stg_yellow_trips
    description: "Standardized Yellow Taxi trip records with deterministic MD5 surrogate key."
    columns:
      - name: trip_id
        description: "Deterministic MD5 surrogate primary key."
        tests:
          - unique:
              config:
                severity: warn
          - not_null
      - name: pickup_datetime
        tests:
          - not_null

  - name: int_all_trips
    description: "Combined Green and Yellow taxi trips joined with taxi zones."
    columns:
      - name: trip_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null
      - name: service_type
        tests:
          - accepted_values:
              values: ['green_trip', 'yellow_trip']
      - name: pickup_location_id
        tests:
          - not_null
      - name: dropoff_location_id
        tests:
          - not_null

  - name: mart_daily_taxi_performance
    description: "Daily aggregated operational and revenue metrics by borough and taxi type."
    columns:
      - name: pickup_date
        tests:
          - not_null

  - name: mart_demand_prediction
    description: "Hourly demand aggregation used as the primary feature store for ML models."
    columns:
      - name: pickup_date
        tests:
          - not_null
      - name: pickup_hour
        tests:
          - not_null
      - name: total_trips
        tests:
          - not_null

  - name: mart_trip_location_network_metrics
    description: "Monthly aggregated trip network graph flows and OD pairs for network centrality and route analytics."
    columns:
      - name: pickup_month
        tests:
          - not_null
      - name: source_location
        tests:
          - not_null
      - name: target_location
        tests:
          - not_null
      - name: trip_count
        tests:
          - not_null
